<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <script>
    // ★ D-day 목표 날짜를 여기서 바꾸세요. (YYYY-MM-DD)
    const targetDate = "2026-12-18";

    // ★ D-day 아래에 표시할 문구
    const targetLabel = "기말까지";
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전하람의 목표 페이지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background: linear-gradient(135deg, #eaf5ff, #f0edff);
      font-family: "맑은 고딕", sans-serif;
      color: #263747;
    }

    /* 세 카드의 공통 크기 */
    .dday-card,
    .card,
    .mandalart {
      width: 100%;
      max-width: 440px;
      min-width: 0;
      flex-shrink: 0;
      border-radius: 28px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    /* D-day */
    .dday-card {
      padding: 28px 16px;
      background: linear-gradient(135deg, #3478ba, #6b70c6);
      box-shadow: 0 14px 40px rgba(65, 100, 145, 0.16);
      color: #ffffff;
    }

    .dday-number {
      margin: 0;
      font-size: clamp(48px, 14vw, 76px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -2px;
    }

    .dday-label {
      margin: 10px 0 0;
      font-size: 15px;
    }

    /* 자기소개 */
    .card {
      padding: 40px clamp(16px, 5vw, 32px);
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(65, 100, 145, 0.13);
    }

    .emoji {
      margin-bottom: 20px;
      font-size: 76px;
      line-height: 1.2;
    }

    .card h1 {
      margin: 0 0 14px;
      font-size: 30px;
    }

    .intro {
      margin: 0;
      color: #657587;
      font-size: 16px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 26px 0 32px;
      padding: 0;
      list-style: none;
    }

    .tags li {
      max-width: 100%;
      padding: 9px 16px;
      border-radius: 999px;
      background: #edf5ff;
      color: #356b9e;
      font-size: 14px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      background: #3478ba;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.5;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .button:hover {
      background: #265f98;
    }

    .button:focus-visible {
      outline: 3px solid #263747;
      outline-offset: 4px;
    }

    /* 만다라트 */
    .mandalart {
      padding: clamp(12px, 4vw, 24px);
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(65, 100, 145, 0.13);
    }

    .mandalart h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .mandalart-guide {
      margin: 0 0 20px;
      color: #657587;
      font-size: 13px;
    }

    .mandalart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(4px, 1.5vw, 8px);
    }

    /* 바깥 상자가 정사각형 크기를 유지해요. */
    .goal-box {
      position: relative;
      min-width: 0;
      aspect-ratio: 1 / 1;
    }

    .mandalart-cell {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: clamp(6px, 2vw, 12px);
      border: 2px solid transparent;
      border-radius: 14px;
      background: #edf5ff;
      color: #356b9e;
      font-family: inherit;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 600;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
      resize: none;
    }

    .mandalart-cell--main {
      background: #3478ba;
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(14px, 3.6vw, 18px);
    }

    .mandalart-cell:focus {
      outline: 3px solid #8398d8;
      outline-offset: 1px;
      z-index: 1;
    }

    .mandalart-status {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: #657587;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <!-- ① D-day -->
  <section class="dday-card" aria-label="목표일까지 남은 날짜">
    <p class="dday-number" id="dday-number">D-day</p>
    <p class="dday-label" id="dday-label">기말까지</p>
  </section>

  <!-- ② 자기소개 카드 -->
  <main class="card">
    <div class="emoji" role="img" aria-label="파도">🌊</div>

    <h1>전하람</h1>

    <p class="intro">
      영화와 하늘을 좋아하는 고등학교 2학년입니다
    </p>

    <ul class="tags" aria-label="좋아하는 것">
      <li>게임</li>
      <li>야구</li>
      <li>영화</li>
    </ul>

    <!-- ★ YOUR_ID를 본인의 깃허브 아이디로 바꿔 주세요. -->
    <a class="button" href="https://github.com/YOUR_ID">
      내 깃허브
    </a>
  </main>

  <!-- ③ 만다라트 목표판 -->
  <section class="mandalart" aria-labelledby="goals-title">
    <h2 id="goals-title">나의 목표</h2>
    <p class="mandalart-guide">칸을 눌러서 고칠 수 있어요</p>

    <div class="mandalart-grid">
      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 1">매일 30분 영어 듣기</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 2">수학 오답노트</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 3">주 3회 운동</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 4">독서 월 1권</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell mandalart-cell--main"
          aria-label="가운데 큰 목표">해양생물학과 진학</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 5">코딩 동아리 발표</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 6">7시간 수면</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 7">봉사활동 20시간</textarea>
      </div>

      <div class="goal-box">
        <textarea class="mandalart-cell"
          aria-label="세부 목표 8">코딩 포트폴리오</textarea>
      </div>
    </div>

    <p class="mandalart-status" id="save-status" role="status">
      수정한 내용은 이 브라우저에 자동 저장돼요.
    </p>
  </section>

  <script>
    // D-day 계산
    function updateDday() {
      const [year, month, day] = targetDate.split("-").map(Number);
      const today = new Date();

      // 시간은 제외하고 날짜만 비교해요.
      const target = Date.UTC(year, month - 1, day);
      const current = Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
      );

      const daysLeft = Math.round((target - current) / 86400000);

      document.getElementById("dday-number").textContent =
        daysLeft > 0 ? `D-${daysLeft}` :
        daysLeft === 0 ? "D-day" :
        `D+${Math.abs(daysLeft)}`;

      document.getElementById("dday-label").textContent = targetLabel;
    }

    updateDday();
    setInterval(updateDday, 60000);

    // 만다라트 저장 및 불러오기
    (() => {
      const storageKey = "my-mandalart-goals-v1";
      const cells = [
        ...document.querySelectorAll(".mandalart-cell")
      ];
      const status = document.getElementById("save-status");

      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));

        if (Array.isArray(saved)) {
          cells.forEach((cell, index) => {
            if (typeof saved[index] === "string") {
              cell.value = saved[index];
            }
          });
        }
      } catch {
        status.textContent =
          "저장 내용을 불러올 수 없어요. 브라우저 설정을 확인해 주세요.";
      }

      cells.forEach((cell) => {
        cell.addEventListener("input", () => {
          try {
            const goals = cells.map((item) => item.value);
            localStorage.setItem(storageKey, JSON.stringify(goals));
            status.textContent = "저장했어요 ✓";
          } catch {
            status.textContent =
              "자동 저장이 안 돼요. 브라우저 설정을 확인해 주세요.";
          }
        });
      });
    })();
  </script>
</body>
</html>
